name: Test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15
            xcode: "16.4"
          - os: windows-latest
          - os: windows-11-arm
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ matrix.xcode }}
        name: select xcode
        # zig 0.15 can't link against the newer Xcode SDKs (undefined libSystem symbols)
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          xcrun --show-sdk-path
      - uses: marler8997/setup-anyzig@master
      - run: zig build test --summary all
      - run: zig build install -Dsha=${{ github.sha }} --summary all
